name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest tests/ -v --cov=slo_tracker --cov-report=term-missing --cov-fail-under=95

  rules:
    name: Generated rules
    runs-on: ubuntu-latest
    env:
      PROMETHEUS_VERSION: 2.53.0
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install promtool
        run: |
          curl -sSL -o prometheus.tar.gz \
            "https://github.com/prometheus/prometheus/releases/download/v${PROMETHEUS_VERSION}/prometheus-${PROMETHEUS_VERSION}.linux-amd64.tar.gz"
          tar xzf prometheus.tar.gz
          sudo install "prometheus-${PROMETHEUS_VERSION}.linux-amd64/promtool" /usr/local/bin/

      - name: Install kubeconform
        run: |
          curl -sSL -o kubeconform.tar.gz \
            https://github.com/yannh/kubeconform/releases/download/v0.6.7/kubeconform-linux-amd64.tar.gz
          tar xzf kubeconform.tar.gz kubeconform
          sudo install kubeconform /usr/local/bin/

      - name: Install the package
        run: pip install -e ".[dev]"

      - name: Run the generator tests that need promtool
        run: pytest tests/test_alert_generator.py -v

      - name: Prometheus accepts the rules generated from the shipped config
        run: |
          # The generator can produce well-formed YAML that Prometheus refuses to
          # load. Its own parser is the only authority on that.
          slo-tracker generate-alerts --config config/slos.yaml --format rules \
            --output /tmp/rules.yaml
          promtool check rules /tmp/rules.yaml

      - name: The operator would accept the PrometheusRule
        run: |
          slo-tracker generate-alerts --config config/slos.yaml --output /tmp/rule.yaml
          kubeconform -strict -summary \
            -kubernetes-version 1.29.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            /tmp/rule.yaml

      - name: Prometheus accepts the gated rules
        run: |
          slo-tracker generate-alerts --config config/slos.yaml --format rules \
            --engine gated --output /tmp/gated.yaml
          promtool check rules /tmp/gated.yaml

      - name: The daemon manifests are valid
        run: |
          kubeconform -strict -summary \
            -kubernetes-version 1.29.0 \
            -schema-location default \
            -schema-location 'https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json' \
            deploy/daemon.yaml

      - name: The manifest carries a selector label
        run: |
          # A PrometheusRule the operator's ruleSelector does not match applies
          # cleanly and is then ignored forever, which is the worst failure shape
          # available: no error, no rules.
          grep -q "release: kube-prometheus-stack" /tmp/rule.yaml \
            || { echo "generated PrometheusRule has no selector label"; exit 1; }

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install ruff==0.16.1
      - run: ruff check slo_tracker/ tests/

  benchmark:
    name: Benchmark smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
      - run: pip install -e .
      - name: Run the false-page simulation
        run: python benchmarks/false_page_simulation.py --ticks 50 --rps 0.5 --seed 1

  image:
    name: Daemon image
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Build the image and run its CLI
        run: |
          docker build -t slo-tracker:ci .
          docker run --rm --entrypoint slo-tracker slo-tracker:ci serve --help
