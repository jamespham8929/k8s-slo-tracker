# Runs `slo-tracker serve` next to kube-prometheus-stack. Build the image from
# the Dockerfile at the repo root, then point the Deployment at it.
#
#   kubectl create configmap slo-tracker-config -n monitoring \
#     --from-file=slos.yaml=config/slos.yaml
#   kubectl apply -f deploy/daemon.yaml
#   slo-tracker generate-alerts --config config/slos.yaml --engine gated | kubectl apply -f -
apiVersion: apps/v1
kind: Deployment
metadata:
  name: slo-tracker
  namespace: monitoring
  labels:
    app.kubernetes.io/name: slo-tracker
spec:
  # One replica. Two would export the same decisions twice, and the alerts
  # already aggregate over pods, so a second one adds nothing.
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: slo-tracker
  template:
    metadata:
      labels:
        app.kubernetes.io/name: slo-tracker
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: slo-tracker
          image: ghcr.io/jamespham8929/slo-tracker:latest
          args: ["--prometheus", "http://prometheus-operated.monitoring:9090", "--interval", "60"]
          ports:
            - name: metrics
              containerPort: 9105
          readinessProbe:
            httpGet:
              path: /metrics
              port: metrics
          resources:
            requests:
              cpu: 20m
              memory: 64Mi
            limits:
              memory: 128Mi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: config
              mountPath: /config
              readOnly: true
      volumes:
        - name: config
          configMap:
            name: slo-tracker-config
---
apiVersion: v1
kind: Service
metadata:
  name: slo-tracker
  namespace: monitoring
  labels:
    app.kubernetes.io/name: slo-tracker
spec:
  selector:
    app.kubernetes.io/name: slo-tracker
  ports:
    - name: metrics
      port: 9105
      targetPort: metrics
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: slo-tracker
  namespace: monitoring
  labels:
    app.kubernetes.io/name: slo-tracker
    release: kube-prometheus-stack
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: slo-tracker
  endpoints:
    - port: metrics
      interval: 30s
