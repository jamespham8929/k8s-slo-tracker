[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "k8s-slo-tracker"
version = "0.1.0"
description = "Confidence-gated, traffic-adaptive SLO burn-rate alerting for Kubernetes services."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "click>=8.1.7",
    "pyyaml>=6.0.1",
    "requests>=2.31.0",
    "rich>=13.7.0",
    "python-dateutil>=2.8.2",
    "prometheus-client>=0.20.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4",
    "pytest-mock>=3.11",
    "pytest-cov>=4.1",
    "ruff>=0.1",
]

[project.scripts]
slo-tracker = "slo_tracker.cli:cli"

[tool.setuptools]
packages = ["slo_tracker"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
